[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/auth/hash_password.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
skip_covered = false
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length — handled loosely; long Spanish-language strings are common
]

[tool.mypy]
python_version = "3.11"
files = ["app", "tests"]
plugins = ["pydantic.mypy"]

warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

# The Flask app + tests are practical rather than maximally strict; core/,
# shared/, the auth rules and every domain's SQL are the highest-value modules
# to hold to a tight bar.
[[tool.mypy.overrides]]
module = [
    "app.core.*",
    "app.shared.*",
    "app.auth.service",
    "app.auth.permissions",
    "app.auth.repository",
    "app.auth.repository.*",
    "app.customers.repository",
    "app.customers.repository.*",
    "app.pricing.repository",
    "app.inventory.repository",
    "app.production.service",
    "app.production.repository",
    "app.cash_summary.service",
    "app.orders.service",
    "app.orders.pedido_upload",
    "app.orders.pdf_extract",
    "app.orders.xlsx_extract",
    "app.orders.repository",
    "app.orders.repository.*",
]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "dateutil.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

# None of these ships type information (no py.typed, no stubs installed here).
[[tool.mypy.overrides]]
module = ["pdfplumber.*", "reportlab.*", "openpyxl.*", "flask_wtf.*"]
ignore_missing_imports = true
