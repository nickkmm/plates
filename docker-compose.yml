services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - plates_db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Bound to localhost only — not exposed to the internet.
      # Host port 5433 because 5432 is already taken by another
      # project's Postgres on this VPS. The future Go app runs on
      # the same VPS and connects via 127.0.0.1:5433.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  plates_db_data:
