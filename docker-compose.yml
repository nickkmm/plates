services:
  db:
    image: postgres:16
    container_name: plates-db-1
    restart: unless-stopped
    env_file: .env
    volumes:
      - plates_db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Bound to localhost only — not exposed to the internet.
      # Host port 5433 because 5432 is already taken by another
      # project's Postgres on this VPS.
      - "127.0.0.1:5433:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    container_name: plates-web
    restart: unless-stopped
    env_file: .env
    environment:
      # NOT "db" -- on the VPS, `web` also joins the shared `edge` network so
      # nginx can reach it, and the `informes` stack's own compose service is
      # ALSO named "db" (its MySQL). Docker's embedded DNS resolves the plain
      # "db" hostname ambiguously across both networks a multi-network
      # container is attached to, and picked informes' MySQL instead of our
      # own Postgres (found in production: every DB-touching route 500'd,
      # connecting to the wrong container). The container_name below is
      # unique across both stacks, so it can't collide.
      DB_HOST: plates-db-1
      DB_PORT: "5432"
    ports:
      # Localhost only — for local dev and on-VPS debugging. In production the
      # shared nginx reaches the app over the `edge` network as plates_web:8000.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal: {}
      edge:
        aliases:
          - plates_web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Web log viewer (Fase 1e follow-up) -- lets the app owner see live
  # container logs from a browser instead of SSH'ing into the VPS. Only
  # needs the Docker socket (to read logs) and the `edge` network (so the
  # shared nginx can reach it) -- no `internal` network, it never talks to
  # the DB. Auth is Dozzle's own built-in user store (DOZZLE_AUTH_PROVIDER),
  # not something this compose file manages -- see docs/LOCAL_DEVELOPMENT.md.
  dozzle:
    image: amir20/dozzle:v11.1.1
    container_name: plates-dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Generated once on the VPS (`docker run --rm amir20/dozzle:v11.1.1
      # generate ...` per docs/LOCAL_DEVELOPMENT.md), never committed --
      # gitignored, survives `git reset --hard` across deploys same as .env.
      - ./dozzle_users.yml:/data/users.yml
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      # Served under /dozzle/ on the same placas.ingse.co domain (see the
      # informes-stack nginx config) instead of a new subdomain -- avoids
      # needing a second DNS record/TLS cert for a tool this small.
      DOZZLE_BASE: /dozzle
    ports:
      # Localhost only -- for local dev / on-VPS debugging without going
      # through nginx. Production access is https://placas.ingse.co/dozzle/.
      - "127.0.0.1:8081:8080"
    networks:
      edge:
        aliases:
          - plates_dozzle
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal: {}
  # Shared with the existing `informes` stack so its nginx can proxy to us by
  # name. The network already exists on the VPS (created by informes). Locally,
  # create it once with: docker network create informes_informes_net
  edge:
    external: true
    name: informes_informes_net

volumes:
  plates_db_data:
