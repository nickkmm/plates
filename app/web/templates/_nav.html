<style>
  .tabs .logout { margin-left:auto; display:flex; align-items:center; }
  .tabs .logout button {
    background:none; border:0; color:#555; font-weight:600; font-family:inherit;
    font-size:1rem; cursor:pointer; padding:.55rem 1rem; border-radius:8px;
  }
  .tabs .logout button:hover { background:#fdecec; color:#d33; }
</style>
<nav class="tabs">
  {% for endpoint, label, _permission, active_endpoints in nav_items %}
  <a href="{{ url_for(endpoint) }}" class="{{ 'on' if request.endpoint in active_endpoints }}">{{ label }}</a>
  {% endfor %}
  <form method="post" action="{{ url_for('auth_routes.logout') }}" class="logout"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit" title="Cerrar sesión">Salir</button></form>
</nav>
