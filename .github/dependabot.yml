version: 2
updates:
  # Only minor and patch updates are proposed. A major version bump can break
  # the app and goes through a normal issue instead.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      pip-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch

  # web.Dockerfile
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Moving production to a new Python version (3.11 -> 3.x) is a project
      # of its own, not a weekly bump.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch
