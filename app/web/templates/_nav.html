<style>
  .tabs .logout { margin-left:auto; display:flex; align-items:center; }
  .tabs .logout button {
    background:none; border:0; color:#555; font-weight:600; font-family:inherit;
    font-size:1rem; cursor:pointer; padding:.55rem 1rem; border-radius:8px;
  }
  .tabs .logout button:hover { background:#fdecec; color:#d33; }
</style>
<nav class="tabs">
  {% if session.get('role') in pos_roles %}
  <a href="{{ url_for('ingest.ingest') }}" class="{{ 'on' if request.endpoint in ('ingest.ingest','ingest.ingest_pdf') }}">Registrar</a>
  <a href="{{ url_for('cash_summary.cuadre') }}" class="{{ 'on' if request.endpoint in ('cash_summary.cuadre','cash_summary.cuadre_pdf') }}">Cuadre</a>
  {% endif %}
  {% if session.get('role') in full_access_roles %}
  <a href="{{ url_for('review.review') }}" class="{{ 'on' if request.endpoint=='review.review' }}">Revisión</a>
  <a href="{{ url_for('inventory.inventory') }}" class="{{ 'on' if request.endpoint=='inventory.inventory' }}">Inventario</a>
  <a href="{{ url_for('pricing.precios') }}" class="{{ 'on' if request.endpoint=='pricing.precios' }}">Precios</a>
  <a href="{{ url_for('customers.customers') }}" class="{{ 'on' if request.endpoint in ('customers.customers','customers.customer_detail') }}">Clientes</a>
  {% endif %}
  <a href="{{ url_for('records.records') }}" class="{{ 'on' if request.endpoint in ('records.records','records.record_detail') }}">Registros</a>
  <form method="post" action="{{ url_for('auth_routes.logout') }}" class="logout"><button type="submit" title="Cerrar sesión">Salir</button></form>
</nav>
